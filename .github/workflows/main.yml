name: FitFlow verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:unused@127.0.0.1:3306/fitflow_ci
      JWT_SECRET: fitflow-ci-fixture-secret-never-used-in-production-2026
      CORS_ORIGIN: http://127.0.0.1:3107
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npm run db:generate

      - name: Run tests without an external database
        working-directory: ./server
        run: npm test

      - name: Validate and generate PostgreSQL client without a database
        working-directory: ./server
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_URL: postgresql://ci:unused@127.0.0.1:5448/fitflow_ci
          DIRECT_URL: postgresql://ci:unused@127.0.0.1:5448/fitflow_ci
        run: |
          npx prisma validate
          npm run db:generate
